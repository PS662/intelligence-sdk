[project]
name = "intelligence-sdk"
version = "0.1.0"
description = "Config-driven model building: one YAML recipe drives data loading, training, testing and evaluation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "networkx>=3.2",
]

[project.optional-dependencies]
render = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "matplotlib>=3.8", "ruff>=0.6", "pdoc>=14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Only the SDK package is distributed. tools/ (the CLI) is a consumer of the
# package, not part of it - the same relationship a services layer would have.
[tool.hatch.build.targets.wheel]
packages = ["intelligence_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]  # long lines are wrapped by the formatter where it can; the rest are deliberate

[tool.ruff.lint.isort]
known-first-party = ["intelligence_sdk"]
