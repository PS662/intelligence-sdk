[project]
name = "intelligence-sdk"
version = "0.1.0"
description = "Config-driven model building: one YAML recipe drives data loading, training, testing and evaluation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "networkx>=3.2",
]

[project.optional-dependencies]
render = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "matplotlib>=3.8", "ruff>=0.6", "pdoc>=14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
intelligence-sdk = "intelligence_cli:main"

# The SDK package plus the CLI. The CLI stays in tools/ as a consumer of the public
# facade, but ships in the wheel as a top-level module so `intelligence-sdk` runs in
# any venv the package is installed into.
[tool.hatch.build.targets.wheel]
only-include = ["intelligence_sdk", "tools/intelligence_cli.py"]

[tool.hatch.build.targets.wheel.sources]
"tools" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]  # long lines are wrapped by the formatter where it can; the rest are deliberate

[tool.ruff.lint.isort]
known-first-party = ["intelligence_sdk"]
