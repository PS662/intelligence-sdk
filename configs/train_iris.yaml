# Train a classifier on iris. The dataset carries its own split and is saved, so a
# later test recipe can load it and score the recorded test split.
# A list-valued hyperparameter triggers a cross-validated search over the train split.

datasets:
  iris:
    source: file
    path: data/iris.csv
    target: species
    split:
      test_size: 0.2
      stratify: true
    seed: 42
    save_dataset:
      path: data/derived/iris
      overwrite: true

train_rf:
  type: train
  datasets:
    - dataset_name: iris
  preprocessing:
    - step: standard_scaler
  model:
    name: random_forest
    params:
      n_estimators: [20, 50]                # list -> search
      max_depth: 3                          # scalar -> fixed
  hyperparam_search:
    cv: 3
    scoring: accuracy
  seed: 42
  recipe_output:
    save_path: artifacts/train_rf
    overwrite: true
