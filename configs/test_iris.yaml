# Score a saved model on the test split of the dataset it was trained on.
# Run configs/train_iris.yaml first: it saves both the model and the dataset.
# Without the filter every row would be scored; the split reference keeps only
# the rows the model never saw.

test_rf:
  type: test
  model_path: artifacts/train_rf
  datasets:
    - name: test_split
      source: dataset                       # a dataset saved by this tool
      path: data/derived/iris
      filter:
        exclude:
          split: train
  recipe_output:
    save_path: artifacts/test_rf
    overwrite: true
