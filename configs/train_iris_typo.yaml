# train_iris.yaml with a deliberate typo: n_estimator instead of n_estimators.
# Fails in the resolve phase, before any data is read, and suggests the fix.

datasets:
  iris:
    source: file
    path: data/iris.csv
    target: species
    split:
      test_size: 0.2
      stratify: true
    seed: 42
    save_dataset:
      path: data/derived/iris
      overwrite: true

train_rf:
  type: train
  datasets:
    - dataset_name: iris
  preprocessing:
    - step: standard_scaler
  model:
    name: random_forest
    params:
      n_estimator: [20, 50]                # list -> search
      max_depth: 3                          # scalar -> fixed
  hyperparam_search:
    cv: 3
    scoring: accuracy
  seed: 42
  recipe_output:
    save_path: artifacts/train_rf
    overwrite: true
