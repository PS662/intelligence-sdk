# Compare candidate models with stratified k-fold cross-validation.
# Folds are a dataset operation; eval reads them from the dataset it is offered.

datasets:
  iris_builtin:
    source: library                         # scikit-learn's bundled copy; no file needed
    dataset: iris
    target: species
    folds:
      k: 5
      stratify: true
    seed: 42

compare:
  type: eval
  datasets:
    - dataset_name: iris_builtin
  preprocessing:
    - step: standard_scaler
  candidates:
    - name: random_forest
      params:
        n_estimators: 50
    - name: logistic_regression
    - name: knn
      params:
        n_neighbors: 5
  metrics: [accuracy, f1_macro]
  recipe_output:
    save_path: artifacts/compare
    overwrite: true
